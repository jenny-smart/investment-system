name: Month-end ledger freeze and roll
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || inputs.dry_run && 'dry-run' || inputs.mode || 'auto' }}

on:
  # tool-system 主控表「排程設定」（invest_month_end_ledger）每月 1-10、28-31 日每 10 分鐘派送
  # （跟基金淨值同一時段，這次沒抓到的下一輪再固定）。
  # auto: from the 30th (last day in February) to the 10th of the next month,
  # freeze Jennyall blocks whose 總覽 price date is the month's last trading day
  # (after month end, missing ones are scaled to the looked-up month-end NAV);
  # on the 1st, point 總覽 B2:B18 / B40:B51 at the new month.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto decides by date; freeze / roll runs that step now; prices only lists month-end NAVs"
        type: choice
        options: [auto, freeze, roll, prices]
        default: auto
      month:
        description: "Month for freeze / roll, e.g. 2026/10 (blank = default)"
        type: string
        default: ""
      force:
        description: "freeze: skip all checks and freeze every block at current values"
        type: boolean
        default: false
      dry_run:
        description: "Only preview writes"
        type: boolean
        default: false
      scheduled_slot:
        description: "排程設定派送時段（手動執行請留空）"
        type: string
        default: ""
  pull_request:
    paths:
      - month_end_ledger.py
      - asset_summary.py
      - sync_fund_nav.py
      - .github/workflows/month-end-ledger.yml

permissions:
  contents: read

concurrency:
  group: month-end-ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'requests>=2,<3' 'yfinance>=0.2,<2'
      - name: Unit tests
        run: python -m unittest tests.test_month_end_ledger tests.test_asset_summary tests.test_fund_nav
      - name: Freeze / roll 總帳
        # Fork PRs get no secrets, so there is nothing to preview against.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          # Pull requests only preview a freeze; they never write to the sheet.
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
          MODE: ${{ github.event_name == 'pull_request' && 'freeze' || inputs.mode || 'auto' }}
          MONTH: ${{ inputs.month }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--mode "$MODE")
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python month_end_ledger.py "${args[@]}" 2>&1 | tee -a run.out
      - name: Check month-end NAV lookup (preview)
        # Pull requests also check that last month's month-end NAVs can be looked up.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: python month_end_ledger.py --mode prices
      - name: Write update log（更新記錄）
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
        run: |
          args=(--function "月底固定／月初切換總覽（$MODE）" --target "總帳 Jennyall、總覽" --status "$JOB_STATUS" --output run.out)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python run_log.py "${args[@]}"
