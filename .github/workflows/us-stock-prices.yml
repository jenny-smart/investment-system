name: US stock prices to Google Sheets
# The app reads this to tell real updates from previews (see invest_app/sync_schedule.py).
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || inputs.dry_run && 'dry-run' || inputs.mode || 'auto' }}

on:
  # tool-system 主控表「排程設定」（invest_us_prices_night／_morning）每 10 分鐘派送；auto mode
  # only updates Mon-Fri 21:00 to the following 06:00. The app dispatches update.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto runs only Mon-Fri 21:00-06:00 Taipei; update always runs"
        type: choice
        options: [auto, update]
        default: auto
      dry_run:
        description: "Only fetch prices and preview writes"
        type: boolean
        default: false
      scheduled_slot:
        description: "排程設定派送時段（手動執行請留空）"
        type: string
        default: ""
  pull_request:
    paths:
      - sync_us_stock_prices.py
      - .github/workflows/us-stock-prices.yml

permissions:
  contents: read

concurrency:
  group: us-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'yfinance>=0.2,<2'
      - name: Unit tests
        run: python -m unittest tests.test_us_stock_prices
      - name: Update G/H on 總覽 (US stocks)
        shell: bash
        # Fork PRs get no secrets, so there is nothing to preview against.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pull requests only preview; they never write to the sheet.
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
          # Pull requests preview regardless of the time of day.
          MODE: ${{ github.event_name == 'pull_request' && 'update' || inputs.mode || 'auto' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python sync_us_stock_prices.py --mode "$MODE" --dry-run 2>&1 | tee -a run.out
          else
            python sync_us_stock_prices.py --mode "$MODE" 2>&1 | tee -a run.out
          fi
      - name: Write update log（更新記錄）
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          python -c "import gspread" 2>/dev/null || pip install -q 'gspread>=6,<7' 'google-auth>=2,<3'
          args=(--function "美股價格" --target "總覽 G/H（美股）" --status "$JOB_STATUS" --output run.out)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python run_log.py "${args[@]}"
