name: Taiwan stock prices to Google Sheets
# The app reads this to tell real updates from previews (see invest_app/sync_schedule.py).
run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || inputs.dry_run && 'dry-run' || inputs.mode || 'auto' }}

on:
  # tool-system 主控表「排程設定」（invest_tw_prices）週一至五 08:30-14:30 每 10 分鐘派送；
  # auto mode only updates 08:30-14:30 on TWSE trading days.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto runs only 08:30-14:30 Taipei on trading days; update always runs"
        type: choice
        options: [auto, update]
        default: auto
      dry_run:
        description: "Only look up prices and preview writes"
        type: boolean
        default: false
      close_date:
        description: "補正用：YYYYMMDD，用這天的證交所／櫃買正式收盤價更新 J 欄（平常留空）"
        type: string
        default: ""
      scheduled_slot:
        description: "排程設定派送時段（手動執行請留空）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tw-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'requests>=2,<3' 'yfinance>=0.2,<2'
      - name: Update J prices and A2 timestamp
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode || 'auto' }}
          CLOSE_DATE: ${{ inputs.close_date }}
        run: |
          args=(--mode "$MODE")
          [ -n "$CLOSE_DATE" ] && args+=(--close-date "$CLOSE_DATE")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python sync_tw_stock_prices.py "${args[@]}" 2>&1 | tee -a run.out
      - name: Write update log（更新記錄）
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          python -c "import gspread" 2>/dev/null || pip install -q 'gspread>=6,<7' 'google-auth>=2,<3'
          args=(--function "台股價格" --target "台股 J 欄、A2" --status "$JOB_STATUS" --output run.out)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python run_log.py "${args[@]}"
