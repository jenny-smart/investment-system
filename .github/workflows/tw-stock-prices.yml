name: Taiwan stock prices to Google Sheets

on:
  # cron-job.org dispatches this workflow every day at 15:00 Asia/Taipei.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only look up prices and preview writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tw-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'requests>=2,<3' 'yfinance>=0.2,<2'
      - name: Look up prices and update J cells
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python sync_tw_stock_prices.py --dry-run
          else
            python sync_tw_stock_prices.py
          fi
