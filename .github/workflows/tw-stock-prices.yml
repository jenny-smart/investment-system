name: Taiwan stock prices to Google Sheets
# The app reads this to tell real updates from previews (see invest_app/sync_schedule.py).
run-name: ${{ inputs.dry_run && 'dry-run' || inputs.mode || 'auto' }}

on:
  # cron-job.org dispatches this every 10 minutes, 08:00-14:50 Asia/Taipei on
  # weekdays; auto mode only updates 08:30-14:30 on TWSE trading days.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto runs only 08:30-14:30 Taipei on trading days; update always runs"
        type: choice
        options: [auto, update]
        default: auto
      dry_run:
        description: "Only look up prices and preview writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tw-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'requests>=2,<3' 'yfinance>=0.2,<2'
      - name: Update J prices and A2 timestamp
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python sync_tw_stock_prices.py --mode "$MODE" --dry-run
          else
            python sync_tw_stock_prices.py --mode "$MODE"
          fi
