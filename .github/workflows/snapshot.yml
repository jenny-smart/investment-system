name: Portfolio Snapshot
run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || 'Portfolio Snapshot' }}

on:
  # 由 tool-system 主控表「排程設定」（invest_snapshot）08:00 / 20:00 派送，避免 Runner 排程延遲。
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "排程設定派送時段（手動執行請留空）"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install supabase playwright
          playwright install --with-deps chromium

      - name: Wake up Streamlit app（強制重新計算，避免抓到舊資料）
        shell: bash
        run: python wake_app.py 2>&1 | tee -a run.out

      - name: Run snapshot
        shell: bash
        run: python record_snapshot.py 2>&1 | tee -a run.out
      - name: Write update log（更新記錄）
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "import gspread" 2>/dev/null || pip install -q 'gspread>=6,<7' 'google-auth>=2,<3'
          args=(--function "資產快照" --target "Supabase portfolio_snapshots" --status "$JOB_STATUS" --output run.out --always)
          python run_log.py "${args[@]}"
