name: Portfolio Snapshot

on:
  # 由 cron-job.org 依 Asia/Taipei 08:00 / 20:00 觸發，避免 Runner 排程延遲。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install supabase playwright
          playwright install --with-deps chromium

      - name: Wake up Streamlit app（強制重新計算，避免抓到舊資料）
        run: python wake_app.py

      - name: Run snapshot
        run: python record_snapshot.py
