name: Richart FX to 總帳 R column

on:
  schedule:
    # 台北時間週一 00:00 至週五 23:00 每小時整點（台北 = UTC+8）
    - cron: "0 16-23 * * 0"   # 台北週一 00:00–07:00
    - cron: "0 * * * 1-4"     # 台北週一 08:00 至週五 07:00
    - cron: "0 0-15 * * 5"    # 台北週五 08:00–23:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only fetch rates and preview writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: richart-fx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Fetch Richart rates and update R cells
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python sync_richart_fx.py --dry-run
          else
            python sync_richart_fx.py
          fi
