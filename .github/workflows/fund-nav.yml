name: Fund NAV to Google Sheets
# The app reads this to tell real updates from previews (see invest_app/sync_schedule.py).
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.dry_run && 'dry-run' || 'update' }}

on:
  # cron-job.org dispatches this every 30 minutes (:00/:30), all day.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only fetch NAVs and preview writes"
        type: boolean
        default: false
  pull_request:
    paths:
      - sync_fund_nav.py
      - .github/workflows/fund-nav.yml

permissions:
  contents: read

concurrency:
  group: fund-nav
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install 'gspread>=6,<7' 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Unit tests
        run: python -m unittest tests.test_fund_nav tests.test_richart_fx
      - name: Update G/H on 總覽 (fund NAV)
        env:
          # Pull requests only preview; they never write to the sheet.
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python sync_fund_nav.py --dry-run
          else
            python sync_fund_nav.py
          fi
      - name: Update R on 總覽 (FX rates)
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python sync_richart_fx.py --dry-run
          else
            python sync_richart_fx.py
          fi
