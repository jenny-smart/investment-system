name: Keep App Warm
run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || 'Keep App Warm' }}

on:
  # tool-system 主控表「排程設定」（invest_keepalive）每 30 分鐘派送，避免 Streamlit Cloud 休眠冷啟動、
  # 也讓價格快取保持新鮮。成功不寫更新記錄，失敗才寫。
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "排程設定派送時段（手動執行請留空）"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake up Streamlit app
        shell: bash
        run: python wake_app.py 2>&1 | tee -a run.out
      - name: Write update log（更新記錄）
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.INVESTMENT_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "import gspread" 2>/dev/null || pip install -q 'gspread>=6,<7' 'google-auth>=2,<3'
          args=(--function "App 喚醒" --target "investment-system.streamlit.app" --status "$JOB_STATUS" --output run.out)
          python run_log.py "${args[@]}"
